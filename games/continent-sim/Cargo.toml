[package]
name = "continent-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Enable kira audio for normal (WASM) builds.
# Pass --no-default-features to drop kira/cpal/ALSA for native `cargo test`.
default = ["octiron/audio"]

[dependencies]
octiron = { path = "../../engine" }
glam = { version = "0.33.1", features = ["bytemuck"] }
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

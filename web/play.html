<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octiron — play</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #c8ccd6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      pre.err {
        position: fixed;
        top: 1rem;
        left: 1rem;
        color: #ff6b6b;
        padding: 1rem;
        background: rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body>
    <canvas id="octiron-canvas" tabindex="0"></canvas>
    <script type="module">
      const GAMES = {
        demo: { title: "Pong", controls: "Left W/S · Right ↑/↓" },
        invaders: { title: "Invaders", controls: "Move ←/→ · Fire Space" },
        snake: { title: "Snake", controls: "Arrows / WASD" },
        breakout: { title: "Breakout", controls: "Move ←/→" },
        flappy: { title: "Flappy", controls: "Flap with Space" },
        platformer: { title: "Platformer", controls: "Move ←/→ · Jump Space" },
        tetris: { title: "Tetris", controls: "←/→ move · ↑/X rotate · Space drop" },
        survivor: { title: "Survivor", controls: "WASD move · 1/2/3 upgrade · P pause" },
        "continent-sim": { title: "Continent", controls: "Space pause · 1-4 speed · O overlay · P preset · G art · click inspect · M edit/intervene · R new world" },
        "diorama-demo": { title: "Diorama Demo (3D)", controls: "自動回転 — 操作不要" },
      };
      // Only ever resolve to a known game id, so the ?game= value can't be
      // used to tamper with the dynamic import path.
      const requested = new URLSearchParams(location.search).get("game");
      const id = requested && requested in GAMES ? requested : "demo";
      const g = GAMES[id];
      document.title = "Octiron — " + g.title;

      const canvas = document.getElementById("octiron-canvas");
      // winit 0.30 monitors the canvas via ResizeObserver and fires
      // WindowEvent::Resized automatically when the CSS size changes.
      // CSS sets canvas to 100vw × 100vh, so no manual resize handling needed.
      canvas.addEventListener("click", () => canvas.focus());
      canvas.focus();

      // textContent, never HTML, so an error string can't inject markup.
      function showError(message) {
        const pre = document.createElement("pre");
        pre.className = "err";
        pre.textContent = String(message);
        document.body.appendChild(pre);
      }

      import(`./pkg/${id}.js`)
        .then((m) => m.default())
        .catch((err) => {
          showError(err);
          console.error(err);
        });
    </script>
  </body>
</html>

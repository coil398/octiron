[workspace]
resolver = "2"
members = [
    "engine",
    "examples/demo",
    "examples/invaders",
    "examples/snake",
    "examples/breakout",
    "examples/flappy",
    "examples/platformer",
    "examples/tetris",
    "examples/survivor",
    "games/continent-sim",
    "games/diorama-demo",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coil398/octiron"

[workspace.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true

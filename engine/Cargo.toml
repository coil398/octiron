[package]
name = "octiron"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A from-scratch 2D game engine (wgpu + ECS) for web and native, via WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "29.0.3"
winit = "0.30.13"
hecs = { version = "0.11", default-features = false, features = ["std", "macros"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"

# Web (WASM): async wgpu init + canvas glue, plus a WebGL2 fallback backend so
# the engine still runs on browsers without WebGPU (e.g. older Safari).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "console",
] }
wgpu = { version = "29.0.3", features = [
    "webgl",
    "fragile-send-sync-non-atomic-wasm",
] }

# Native desktop: block on async wgpu init and route logs to stderr.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"
